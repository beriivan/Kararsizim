{% extends "base.html" %}

{% block content %}
  <h1 class="page-title">Kararsız mısın? Topluluğa sor.</h1>

  {% for poll in page %}
    {% include "partials/poll_card.html" %}
  {% empty %}
    <section class="card empty-state">
      <p>Henüz kimse kararsız değil 🤷</p>
      <p>İlk anketi sen aç!</p>
      <a class="btn btn-primary" href="{% url 'poll_create' %}">Kararımı sor 🚀</a>
    </section>
  {% endfor %}

  {% include "partials/pagination.html" %}
{% endblock %}
