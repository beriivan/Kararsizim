<header class="navbar">
  <div class="navbar-inner">
    <a class="logo" href="{% url 'home' %}">⚖️ kararsızım</a>
    <nav class="navbar-links">
      {% if user.is_authenticated %}
        <span class="navbar-user">@{{ user.username }}</span>
        <form method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <button type="submit" class="btn btn-text">Çıkış</button>
        </form>
      {% else %}
        <a class="btn btn-text" href="{% url 'login' %}">Giriş yap</a>
        <a class="btn btn-primary" href="{% url 'register' %}">Kayıt ol</a>
      {% endif %}
    </nav>
  </div>
</header>
