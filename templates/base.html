{% load static %}<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#7C5CFF">
  <title>{% block title %}Kararsızım{% endblock %}</title>
  {% block meta %}
    <meta name="description" content="Kararsız mısın? Topluluğa sor.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Kararsızım">
    <meta property="og:title" content="Kararsızım">
    <meta property="og:description" content="Kararsız mısın? Topluluğa sor.">
    <meta property="og:url" content="{{ request.scheme }}://{{ request.get_host }}{{ request.path }}">
    <meta property="og:image" content="{{ request.scheme }}://{{ request.get_host }}{% static 'img/og-image.png' %}">
    <meta name="twitter:card" content="summary_large_image">
  {% endblock %}
  <link rel="icon" href="{% static 'img/favicon.svg' %}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>
  <a class="skip-link" href="#content">İçeriğe geç</a>
  {% include "partials/navbar.html" %}
  {% include "partials/messages.html" %}
  <main class="container" id="content">
    {% block content %}{% endblock %}
  </main>
  <script src="{% static 'js/main.js' %}" defer></script>
</body>
</html>
